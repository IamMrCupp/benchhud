# benchhud — example configuration.
#
# Copy to your user config path (benchhud writes/reads it there automatically;
# see `benchhud --help` once implemented) or point $BENCHHUD_CONFIG at a file.
# Device paths below match the reference Linux bench; adjust for your hardware.

[shell]
# Main-window geometry, restored on launch and written back on quit.
window_width = 1600
window_height = 900
# The dockable panel layout is persisted by the app as an opaque blob under
# [shell] as `layout`; you normally don't edit it by hand.

[shell.logging]
level = "INFO" # DEBUG | INFO | WARNING | ERROR

[output]
# Composited virtual-camera output. Linux only: benchhud writes RGB24 frames
# straight to a v4l2loopback node, which OBS then reads as a camera.
#   sudo modprobe v4l2loopback exclusive_caps=1 card_label=benchhud
# Off until the pipeline lands (Phase 1).
enabled = false
device = "/dev/video10" # the loopback node, not a real camera
width = 1280
height = 720
fps = 15 # paced to the slower feed; thermal is 25 fps, see research.md §4

[panels.scope]
# BTER 4K microscope cam (UVC). On Linux this is a /dev/videoN path; on
# macOS/Windows use an integer camera index instead.
enabled = true
device = "/dev/video4"
# Resolution to ask the camera for (Preferences → Devices → Resolution lists the
# camera's own). 0 x 0 takes its default. 1920 x 1080 suits a 1280 x 720 stream;
# 4K works but decodes heavier.
width = 0
height = 0

[panels.thermal]
# Sipeed T256s. Analysis uses the raw Y16 192x256 @ 25 fps stream.
enabled = false
device = "/dev/video6"

[panels.telemetry]
# OWON SPM8104 (PSU + DMM) over SCPI. Live DMM readout is a hard requirement.
enabled = false
port = "/dev/ttyUSB0" # CH341 USB-serial
baud = 115200

[overlay]
# Thermal-over-scope overlay preferences.
mode = "blend"       # blend (heatmap) | tint (>threshold) | marker (hottest)
alpha = 0.5          # overlay opacity for blend/tint
threshold = 60.0     # °C, for tint mode
tmin = 20.0          # °C mapped to the low end of the colormap
tmax = 100.0         # °C mapped to the high end
colormap = "INFERNO" # INFERNO | MAGMA | PLASMA | VIRIDIS | TURBO | JET | HOT

[registration]
# Thermal→scope alignment, set from the Controls panel and saved here. The
# thermal starts centred and filling the scope view: scale 1.0 is the same field
# of view, higher zooms the thermal in (the thermal camera usually sees much
# more than the microscope). Offsets nudge it in scope pixels.
scale = 1.0
offset_x = 0.0
offset_y = 0.0
rotation_deg = 0.0
version = 2      # 1 = the original top-left placement, converted on first use

[faults]
# Auto-log an over-current fault to the selected repair job when the PSU current
# first crosses the threshold (e.g. powering a shorted board). One note per
# excursion, not per poll. Off by default; tune the threshold to the bench.
auto_log = false
current_threshold_a = 1.0

[telemetry_overlay]
# Burn the live power/DMM readings into the composited (streamed) frame — the
# on-stream copy of the meter dock, in the same 7-segment LCD style. Off by
# default (the app shows the meter locally regardless); flip on when streaming.
enabled = false
corner = "bottom-left" # bottom-left | bottom-right | top-left | top-right
show_psu = true        # VOLTAGE / CURRENT / POWER / MAX CURRENT
show_dmm = true        # the DMM header line
# The readout auto-scales to the frame (tuned for 1280 wide); these adjust it.
scale = 1.0            # size multiplier on top of the automatic scaling
opacity = 1.0          # below 1.0 lets the board show through the readout

[graph_overlay]
# Burn the live V/A/W power trend (the meter dock's chart) into the streamed
# frame. Each line gets its own vertical range, so a small current trace isn't
# flattened by the voltage. The legend shows live values. Off by default. In
# the same corner as the meter readout it stacks beside it, not over it.
enabled = false
corner = "bottom-right" # bottom-left | bottom-right | top-left | top-right
window_seconds = 60.0   # how much history the graph shows
scale = 1.0             # size multiplier on top of the automatic scaling
opacity = 0.9           # below 1.0 lets the board show through

[browser_sources]
# Serve data panels to OBS as Browser sources, one URL per panel, each with a
# transparent background so you can place it anywhere in a scene:
#   http://127.0.0.1:8780/panel/meter   V / A / W / DMM readout
#   http://127.0.0.1:8780/panel/graph   live power trend
#   http://127.0.0.1:8780/panel/job     selected job card (never the customer)
# Works the same on macOS, Linux and Windows. Loopback only; off by default.
enabled = false
port = 8780

[terminal]
# A terminal panel inside the app (your login shell, macOS and Linux). It runs on
# the browser-source port above, loopback only. Off by default.
enabled = false
shell = ""             # empty = your login shell; or e.g. "/bin/zsh"
# Also serve a read-only copy to OBS as a Browser source. The panel's Pause
# button hides it mid-stream (it resumes from that moment, never replaying what
# you typed while paused). The link carries a token, shown in Preferences.
share = false
share_token = ""       # generated on first use; regenerate in Preferences
# What it's attached to: "shell", "owon" (the SCPI query console, through the
# instrument session: queries only), or a serial port's device path. Picked
# from the panel's "Connect to" menu; the OWON's own port always means "owon".
target = "shell"
baud = 115200          # a raw serial port's speed
line_ending = "crlf"   # what Enter sends: crlf | cr | lf
local_echo = false     # show typing, for devices that don't echo it

[intake]
# benchhud-intake ticket API (LAN-only, read-only). Leave base_url empty to run
# standalone with no ticket queue. token is intake's INTAKE_API_TOKEN (sent as a
# bearer token). Customer names from tickets are PII — never composited.
base_url = "" # e.g. "http://intake.repair-bench:8000"
token = ""

[inventory]
# bench-parts inventory API (LAN-only). Leave base_url empty to run standalone
# with no inventory panel data. token is bench-parts' BENCH_PARTS_API_TOKEN
# (sent as a bearer token). Parts data carries no PII — safe to composite.
base_url = "" # e.g. "http://192.168.7.204:8000"
token = ""

[instruments]
# Control policy for the bench instrument (#164). The serial device itself lives
# on [panels.telemetry] — it is not repeated here.
#
# control = false means read-only telemetry: benchhud watches the instrument and
# writes nothing to it. Turning it on lets the HUD set voltage/current, enable
# the output and switch DMM modes. This is a supply wired to other people's
# boards, so that is a deliberate switch, not a default.
control = false
max_voltage = 5.5      # hard ceiling; setpoints above it are refused, not clamped
max_current = 1.0
poll_interval = 0.2    # seconds between telemetry polls

[boards]
# Local board-view library, searched recursively; files are named after the
# board's part number (e.g. 820-00239.obv). Leave library_dir empty if you
# don't keep one. Board files open in the configured viewer via the Tools
# launcher. Keep a schematic PDF beside the board with the same name
# (820-00239.pdf) — FlexBV auto-loads it and cross-probes; benchhud also offers
# an "Open schematic" action for a standalone look.
library_dir = ""                       # e.g. "~/boards"
extensions = ["obv", "brd", "bdv"]     # board-view formats
schematic_extensions = ["pdf"]         # schematic formats filed alongside
viewer = "auto"                        # auto | openboardview | flexbv

[flash]
# The Flash panel: read, back up and write SPI flash chips with flashrom. A
# backup is two reads that must match; dumps are filed with the selected job.
command = "flashrom"      # on PATH, or an absolute path
programmer = "ch341a_spi" # flashrom's -p value; the panel remembers the last one

# External tools surfaced by the launcher panel (Phase 7). Repeat the block per
# tool; `command` is resolved on PATH (or give an absolute path / AppImage).
# `terminal = true` marks a command-line tool: its button types the command at
# the Terminal panel's prompt (or opens a system terminal window when the panel
# is off) instead of launching a window. Tools → Find installed tools sets it.
[[tools]]
name = "OpenBoardView"
command = "openboardview"

[[tools]]
name = "minipro-gui"
command = "minipro-gui"

[[tools]]
name = "flashrom"
command = "flashrom"
terminal = true
