name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE"
  pull_request:
    # `labeled` so adding the `full-ci` label re-runs with the macOS, Windows
    # and arm64 builds (see the `if:` on those jobs).
    types: [opened, synchronize, reopened, labeled]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE"
  # A full run by hand, every platform.
  workflow_dispatch:
  # A release builds its installers with exactly these jobs and checks, at the
  # release tag (release-assets.yml). Empty ref = the event's own commit.
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
        default: ""
      # A release passes true: build and check every platform.
      full:
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  # The workflow name keeps a release build (called from release-please) and the
  # normal build of the same push to main from cancelling each other.
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ inputs.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    # The bench's OS (#158), pinned rather than `ubuntu-latest`: that label
    # moves to a new LTS on GitHub's schedule, and during a rollout it lands on
    # either image at random, so a break looks like flakiness. Bump this on
    # purpose at the next LTS.
    runs-on: ubuntu-26.04
    env:
      # PySide6 uses the offscreen Qt platform plugin in CI (no display).
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3

      - name: Sync (frozen)
        run: uv sync --frozen

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Pytest
        run: uv run pytest

  # The bench installs what CI builds, so the .deb is built here rather than on
  # a laptop (#192). It runs *inside* ubuntu:26.04 rather than on the runner
  # image: Briefcase links the package against the build host's Python, so a
  # package built on 24.04 (Python 3.12) would demand libpython3.12 and refuse
  # to install on the bench's 26.04 (Python 3.14). The container also keeps this
  # independent of the ubuntu-latest migration (#158).
  deb:
    runs-on: ubuntu-26.04
    container: ubuntu:26.04
    steps:
      - name: Install build tooling
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential ca-certificates curl dpkg-dev git \
            python3 python3-dev python3-pip python3-venv

      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # Building natively, Briefcase checks that the package's own
      # system_runtime_requires are installed on the build host (the Docker path
      # would do this inside its container). Read the list from pyproject rather
      # than repeating it, so the two can't drift.
      - name: Install the package's runtime libraries
        run: |
          deps=$(python3 -c "import tomllib;print(' '.join(tomllib.load(open('pyproject.toml','rb'))['tool']['briefcase']['app']['benchhud']['linux']['system']['debian']['system_runtime_requires']))")
          echo "installing: $deps"
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends $deps

      # No --target: Briefcase only reaches for Docker when given a target image,
      # and we are already inside the target container, so it builds in place.
      - name: Build the .deb
        run: |
          uvx briefcase create  linux system --no-input
          uvx briefcase build   linux system --no-input
          uvx briefcase package linux system --adhoc-sign --no-input

      - uses: actions/upload-artifact@v4
        with:
          name: benchhud-deb
          path: dist/*.deb
          if-no-files-found: error

  # Install the artifact the way the bench does, in a clean container: proves
  # apt can resolve every dependency and that the app actually starts.
  deb-verify:
    needs: deb
    runs-on: ubuntu-26.04
    container: ubuntu:26.04
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: benchhud-deb
          path: dist

      - name: apt install the package
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y ./dist/*.deb

      - name: It installed what an operator needs
        run: |
          dpkg -s benchhud | grep -E "^Status|^Version"
          test -x /usr/bin/benchhud
          test -f /usr/share/applications/com.iammrcupp.benchhud.desktop
          test -f /usr/share/icons/hicolor/256x256/apps/com.iammrcupp.benchhud.png
          benchhud --version

      - name: The terminal panel's QtWebEngine has every library it links
        run: |
          # QtWebEngine loads only when the terminal is turned on, so a missing
          # system library wouldn't show in the startup check below.
          missing=0
          for f in $(find / -xdev \( -name 'libQt6WebEngineCore.so*' -o -name QtWebEngineProcess \) -path '*benchhud*' -type f 2>/dev/null); do
            echo "== $f"
            if ldd "$f" | grep "not found"; then missing=1; fi
          done
          [ -n "$(find / -xdev -name QtWebEngineProcess -path '*benchhud*' 2>/dev/null)" ] || { echo "QtWebEngineProcess not in the package"; exit 1; }
          exit $missing

      - name: It starts (headless)
        run: |
          # Still running when the timeout fires (124) is the pass: Qt, OpenCV
          # and the job DB all loaded. Anything else is a startup crash.
          timeout 60 benchhud > run.log 2>&1 || code=$?
          if [ "${code:-0}" != "124" ]; then
            echo "benchhud exited with ${code:-0}; expected to still be running"
            cat run.log
            exit 1
          fi

  # The Windows build (#207). There's no Windows bench yet, so this is the only
  # proof the app packages and starts there. Briefcase fetches WiX itself.
  msi:
    # macOS and Windows runners cost 10x and 2x Linux minutes, so this runs
    # for releases, by hand, or on a PR labelled full-ci, not on every push.
    if: inputs.full || github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'full-ci')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}

      # Briefcase bundles the build host's Python version, so pin it here
      # rather than taking whatever the runner image defaults to.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Briefcase
        run: python -m pip install briefcase

      - name: Build the MSI
        run: |
          briefcase create  windows app --no-input
          briefcase build   windows app --no-input
          briefcase package windows app --adhoc-sign --no-input

      - uses: actions/upload-artifact@v4
        with:
          name: benchhud-msi
          path: dist/*.msi
          if-no-files-found: error

  # The macOS app (#206): build it on every PR and check the built bundle
  # starts, like deb-verify and msi-verify. Ad-hoc signed: a Developer ID
  # signature needs the certificate in CI (#173), so the release build is still
  # signed on the maintainer's Mac (docs/PACKAGING.md).
  macos-app:
    # macOS and Windows runners cost 10x and 2x Linux minutes, so this runs
    # for releases, by hand, or on a PR labelled full-ci, not on every push.
    if: inputs.full || github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'full-ci')
    runs-on: macos-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Briefcase
        run: python -m pip install briefcase

      - name: Build the app
        run: |
          briefcase create macOS app --no-input
          briefcase build  macOS app --no-input

      - name: It starts (headless)
        run: |
          # No camera chosen, so a runner can never sit on a camera prompt.
          cfg="$RUNNER_TEMP/benchhud.toml"
          printf '[panels.scope]\nenabled = false\ndevice = ""\n' > "$cfg"
          export BENCHHUD_CONFIG="$cfg"
          # Still running after 45 s is the pass: Qt, OpenCV and the job DB all
          # loaded. An exit before then is a startup crash. macOS has no
          # `timeout`, so this polls.
          build/benchhud/macos/app/benchhud.app/Contents/MacOS/benchhud &
          pid=$!
          for _ in $(seq 45); do kill -0 "$pid" 2>/dev/null || break; sleep 1; done
          if ! kill -0 "$pid" 2>/dev/null; then
            wait "$pid"; echo "benchhud exited with $?; expected it to still be running"; exit 1
          fi
          echo "still running after 45s"
          kill "$pid"

      - name: Package (ad-hoc signed)
        run: briefcase package macOS app --adhoc-sign -p zip --no-input

      - uses: actions/upload-artifact@v4
        with:
          name: benchhud-macos
          path: dist/*.zip
          if-no-files-found: error

  # Install it silently on a clean runner and check it starts, like deb-verify.
  msi-verify:
    needs: msi
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: benchhud-msi
          path: dist

      - name: msiexec install (silent)
        run: |
          $msi = (Get-ChildItem dist\*.msi | Select-Object -First 1).FullName
          $p = Start-Process msiexec.exe -Wait -PassThru `
            -ArgumentList '/i', "`"$msi`"", '/qn', '/l*v', 'msi.log'
          if ($p.ExitCode -ne 0) {
            Get-Content msi.log -Tail 80
            throw "msiexec exited with $($p.ExitCode)"
          }

      # Don't guess the install scope: look where a per-machine and a per-user
      # install would land, and use whichever holds benchhud.exe.
      - name: Find the install
        run: |
          $roots = @($env:ProgramFiles, ${env:ProgramFiles(x86)}, "$env:LOCALAPPDATA\Programs", $env:LOCALAPPDATA)
          $exe = Get-ChildItem -Path $roots -Recurse -Filter benchhud.exe -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -notmatch '\\Temp\\' } | Select-Object -First 1
          if (-not $exe) { throw "benchhud.exe not found under: $($roots -join ', ')" }
          Write-Host "installed at: $($exe.DirectoryName)"
          Get-ChildItem $exe.DirectoryName | Format-Table Name, Length
          "BENCHHUD_EXE=$($exe.FullName)" | Out-File -Append $env:GITHUB_ENV

      - name: It reports a version
        run: |
          # The GUI stub has no console, so its stdout may go nowhere. Print
          # what comes back; a missing line isn't a failure.
          $out = & $env:BENCHHUD_EXE --version 2>&1 | Out-String
          if ($out.Trim()) { Write-Host $out } else { Write-Host "no console output from the GUI stub; skipped" }

      - name: It starts (headless)
        run: |
          # Still running after the wait is the pass: Qt, OpenCV and the job DB
          # all loaded. An exit before then is a startup crash.
          $p = Start-Process $env:BENCHHUD_EXE -PassThru
          Start-Sleep -Seconds 45
          if ($p.HasExited) { throw "benchhud exited with $($p.ExitCode); expected to still be running" }
          Write-Host "still running after 45s (pid $($p.Id))"
          Stop-Process -Id $p.Id -Force
