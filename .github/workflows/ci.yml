name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    # Pinned deliberately, not out of caution about a specific break: GitHub
    # migrates `ubuntu-latest` to 26.04 over 2026-10-19 → 2026-11-19, and during
    # that window the label is non-deterministic — some runs land on 24.04, some
    # on 26.04. A failure would look like flakiness rather than an OS change.
    # Bump to `ubuntu-26.04` deliberately once it's out (#158); the bench runs
    # 26.04, so that's the target, not something to avoid.
    runs-on: ubuntu-24.04
    env:
      # PySide6 uses the offscreen Qt platform plugin in CI (no display).
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3

      - name: Sync (frozen)
        run: uv sync --frozen

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Pytest
        run: uv run pytest
