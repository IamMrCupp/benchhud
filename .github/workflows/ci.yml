name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE"
  pull_request:
    # `labeled` so adding the `full-ci` label re-runs with the macOS, Windows
    # and arm64 builds (see the `if:` on those jobs).
    types: [opened, synchronize, reopened, labeled]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE"
  # A full run by hand, every platform.
  workflow_dispatch:
  # A release builds its installers with exactly these jobs and checks, at the
  # release tag (release-assets.yml). Empty ref = the event's own commit.
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
        default: ""
      # A release passes true: build and check every platform.
      full:
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  # The workflow name keeps a release build (called from release-please) and the
  # normal build of the same push to main from cancelling each other.
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ inputs.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    # The bench's OS (#158), pinned rather than `ubuntu-latest`: that label
    # moves to a new LTS on GitHub's schedule, and during a rollout it lands on
    # either image at random, so a break looks like flakiness. Bump this on
    # purpose at the next LTS.
    runs-on: ubuntu-26.04
    env:
      # PySide6 uses the offscreen Qt platform plugin in CI (no display).
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3

      - name: Sync (frozen)
        run: uv sync --frozen

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Pytest
        run: uv run pytest

  # The bench installs what CI builds, so the .deb is built here rather than on
  # a laptop (#192). It runs *inside* ubuntu:26.04 rather than on the runner
  # image: Briefcase links the package against the build host's Python, so a
  # package built on 24.04 (Python 3.12) would demand libpython3.12 and refuse
  # to install on the bench's 26.04 (Python 3.14). The container also keeps this
  # independent of the ubuntu-latest migration (#158).
  deb:
    runs-on: ubuntu-26.04
    container: ubuntu:26.04
    steps:
      - name: Install build tooling
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential ca-certificates curl dpkg-dev git \
            python3 python3-dev python3-pip python3-venv

      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # Building natively, Briefcase checks that the package's own
      # system_runtime_requires are installed on the build host (the Docker path
      # would do this inside its container). Read the list from pyproject rather
      # than repeating it, so the two can't drift.
      - name: Install the package's runtime libraries
        run: |
          deps=$(python3 -c "import tomllib;print(' '.join(tomllib.load(open('pyproject.toml','rb'))['tool']['briefcase']['app']['benchhud']['linux']['system']['debian']['system_runtime_requires']))")
          echo "installing: $deps"
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends $deps

      # No --target: Briefcase only reaches for Docker when given a target image,
      # and we are already inside the target container, so it builds in place.
      - name: Build the .deb
        run: |
          uvx briefcase create  linux system --no-input
          uvx briefcase build   linux system --no-input
          uvx briefcase package linux system --adhoc-sign --no-input

      - uses: actions/upload-artifact@v4
        with:
          name: benchhud-deb
          path: dist/*.deb
          if-no-files-found: error

  # Install the artifact the way the bench does, in a clean container: proves
  # apt can resolve every dependency and that the app actually starts.
  deb-verify:
    needs: deb
    runs-on: ubuntu-26.04
    container: ubuntu:26.04
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: benchhud-deb
          path: dist

      - name: apt install the package
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y ./dist/*.deb

      - name: It installed what an operator needs
        run: |
          dpkg -s benchhud | grep -E "^Status|^Version"
          test -x /usr/bin/benchhud
          test -f /usr/share/applications/com.iammrcupp.benchhud.desktop
          test -f /usr/share/icons/hicolor/256x256/apps/com.iammrcupp.benchhud.png
          benchhud --version

      - name: The terminal panel's QtWebEngine has every library it links
        run: |
          # QtWebEngine loads only when the terminal is turned on, so a missing
          # system library wouldn't show in the startup check below.
          missing=0
          for f in $(find / -xdev \( -name 'libQt6WebEngineCore.so*' -o -name QtWebEngineProcess \) -path '*benchhud*' -type f 2>/dev/null); do
            echo "== $f"
            if ldd "$f" | grep "not found"; then missing=1; fi
          done
          [ -n "$(find / -xdev -name QtWebEngineProcess -path '*benchhud*' 2>/dev/null)" ] || { echo "QtWebEngineProcess not in the package"; exit 1; }
          exit $missing

      - name: It starts (headless)
        run: |
          # Still running when the timeout fires (124) is the pass: Qt, OpenCV
          # and the job DB all loaded. Anything else is a startup crash.
          timeout 60 benchhud > run.log 2>&1 || code=$?
          if [ "${code:-0}" != "124" ]; then
            echo "benchhud exited with ${code:-0}; expected to still be running"
            cat run.log
            exit 1
          fi

  # softcam.dll, the Windows virtual camera (#124). Built from pinned source
  # (packaging/windows/build-softcam.ps1), then proved the way a camera app
  # would use it: benchhud publishes a known picture and a DirectShow reader
  # has to get the same picture back. The MSI ships the DLL this job built, so
  # an MSI is only made from a DLL that passed.
  softcam:
    # Windows runners cost 2x Linux minutes, so this runs when the MSI does.
    if: inputs.full || github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'full-ci')
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}

      - name: Build softcam.dll
        run: ./packaging/windows/build-softcam.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: benchhud-softcam
          path: packaging/windows/softcam/softcam.dll
          if-no-files-found: error

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        run: python -m pip install uv

      - name: Sync (frozen)
        run: uv sync --frozen

      # Before it's registered a sender would still take frames, and no camera
      # app could see them. benchhud has to refuse and say what to do.
      - name: Unregistered, benchhud says so
        env:
          BENCHHUD_REQUIRE_SOFTCAM: unregistered
        run: |
          uv run benchhud virtual-camera status
          if ($LASTEXITCODE -eq 0) { throw "softcam is already registered on a clean runner" }
          uv run pytest -v -rs tests/test_softcam_windows.py -k unregistered
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # The same call the Preferences button makes. The runner is already an
      # administrator, so Windows has nothing to ask.
      - name: Register it
        run: |
          uv run benchhud virtual-camera register
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run benchhud virtual-camera status
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # -rs lists every skip: a test that skipped here didn't run anywhere.
      - name: A camera app sees what benchhud sends
        env:
          BENCHHUD_REQUIRE_SOFTCAM: registered
        run: uv run pytest -v -rs tests/test_softcam_windows.py

      - name: Unregister it
        run: |
          uv run benchhud virtual-camera unregister
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run benchhud virtual-camera status
          if ($LASTEXITCODE -eq 0) { throw "softcam is still registered after unregister" }
          exit 0

  # The Windows build (#207). There's no Windows bench yet, so this is the only
  # proof the app packages and starts there. Briefcase fetches WiX itself.
  msi:
    # macOS and Windows runners cost 10x and 2x Linux minutes, so this runs
    # for releases, by hand, or on a PR labelled full-ci, not on every push.
    if: inputs.full || github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'full-ci')
    needs: softcam
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}

      # The virtual camera's DLL, as built and checked by the softcam job.
      # pyproject lists it as a Windows source, so it has to be here first.
      - uses: actions/download-artifact@v4
        with:
          name: benchhud-softcam
          path: packaging/windows/softcam

      # Briefcase bundles the build host's Python version, so pin it here
      # rather than taking whatever the runner image defaults to.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Briefcase
        run: python -m pip install briefcase

      - name: Build the MSI
        run: |
          briefcase create  windows app --no-input
          briefcase build   windows app --no-input
          briefcase package windows app --adhoc-sign --no-input

      - name: softcam.dll, LICENSE and NOTICES are in the app
        shell: pwsh
        run: |
          $app = "build\benchhud\windows\app\src\app"
          foreach ($f in 'softcam.dll', 'LICENSE', 'NOTICES') {
            if (-not (Test-Path "$app\$f")) { Get-ChildItem $app; throw "$f missing from $app" }
          }
          Write-Host "all three in $app"

      - uses: actions/upload-artifact@v4
        with:
          name: benchhud-msi
          path: dist/*.msi
          if-no-files-found: error

  # The terminal's ConPTY backend (#203) against a real pseudo-console. The
  # main suite runs on Linux, where those tests skip, so this is the only place
  # they run. Just the Windows terminal tests, not the whole suite: the rest
  # has never been run on Windows.
  windows-terminal:
    # Windows runners cost 2x Linux minutes, so this runs when the MSI does.
    if: inputs.full || github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'full-ci')
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        run: python -m pip install uv

      - name: Sync (frozen)
        run: uv sync --frozen

      # -rs lists every skip: a ConPTY test that skipped here didn't run anywhere.
      - name: Pytest (the Windows terminal)
        run: >
          uv run pytest -v -rs
          tests/test_terminal_windows.py
          tests/test_terminal_tools.py::test_with_the_terminal_on_the_command_waits_at_the_prompt
          tests/test_terminal_tools.py::test_a_serial_console_is_only_dropped_with_a_yes

  # The macOS app (#206): build it and check the built bundle starts, like
  # deb-verify and msi-verify. A release or a run by hand signs it with the
  # Developer ID and has Apple notarize it (#173), so the .dmg opens on any Mac
  # with no Gatekeeper warning. A pull request stays ad-hoc signed: it doesn't
  # get the certificate.
  macos-app:
    # macOS and Windows runners cost 10x and 2x Linux minutes, so this runs
    # for releases, by hand, or on a PR labelled full-ci, not on every push.
    if: inputs.full || github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'full-ci')
    runs-on: macos-latest
    env:
      QT_QPA_PLATFORM: offscreen
      # Sign for real only off pull requests, and only where the certificate is.
      SIGN: ${{ github.event_name != 'pull_request' && secrets.APPLE_CERTIFICATE != '' }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Briefcase
        run: python -m pip install briefcase

      - name: Build the app
        run: |
          briefcase create macOS app --no-input
          briefcase build  macOS app --no-input

      - name: LICENSE and NOTICES are in the bundle
        run: |
          # Briefcase only copies license-files into a .pkg; the zip carries
          # them because pyproject.toml lists them as macOS sources (#338).
          res=build/benchhud/macos/app/benchhud.app/Contents/Resources/app
          for f in LICENSE NOTICES; do
            test -s "$res/$f" || { echo "$f missing from $res"; ls -la "$res"; exit 1; }
            cmp "$f" "$res/$f"
          done
          echo "LICENSE and NOTICES present"

      - name: It starts (headless)
        run: |
          # No camera chosen, so a runner can never sit on a camera prompt.
          cfg="$RUNNER_TEMP/benchhud.toml"
          printf '[panels.scope]\nenabled = false\ndevice = ""\n' > "$cfg"
          export BENCHHUD_CONFIG="$cfg"
          # Still running after 45 s is the pass: Qt, OpenCV and the job DB all
          # loaded. An exit before then is a startup crash. macOS has no
          # `timeout`, so this polls.
          build/benchhud/macos/app/benchhud.app/Contents/MacOS/benchhud &
          pid=$!
          for _ in $(seq 45); do kill -0 "$pid" 2>/dev/null || break; sleep 1; done
          if ! kill -0 "$pid" 2>/dev/null; then
            wait "$pid"; echo "benchhud exited with $?; expected it to still be running"; exit 1
          fi
          echo "still running after 45s"
          kill "$pid"

      # bench-setup drives benchhud through the app's own binary on a Mac.
      # Inside the bundle Python writes to the system log, so a command has to
      # put stdout back: the answer must arrive bare, on stdout, with no window.
      - name: The app's binary answers commands on stdout
        run: |
          app=build/benchhud/macos/app/benchhud.app/Contents/MacOS/benchhud
          export BENCHHUD_CONFIG="$RUNNER_TEMP/cli.toml"
          version=$("$app" --version)
          echo "$version"
          echo "$version" | grep -qx "benchhud [0-9][0-9.]*"
          test "$("$app" config path)" = "$BENCHHUD_CONFIG"
          printf 'tok-123' | "$app" config set intake.token -
          "$app" config set intake.base_url http://127.0.0.1:8401
          grep -q 'base_url = "http://127.0.0.1:8401"' "$BENCHHUD_CONFIG"

      - name: Package (ad-hoc signed)
        if: env.SIGN != 'true'
        run: briefcase package macOS app --adhoc-sign -p zip --no-input

      # The Developer ID certificate goes into a keychain made for this run.
      # Nothing here echoes a secret; the files are removed at the end.
      - name: Signing certificate
        if: env.SIGN == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/build.keychain-db"
          pass=$(openssl rand -hex 24)
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$pass" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$pass" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security >/dev/null
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$pass" "$keychain" >/dev/null
          # Searched first, with the login keychain kept for the notary profile.
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity=$(security find-identity -v -p codesigning "$keychain" \
            | sed -n 's/.*"\(Developer ID Application: .*\)"$/\1/p' | head -1)
          test -n "$identity" || { echo "no Developer ID Application identity in the certificate"; exit 1; }
          team=$(printf '%s' "$identity" | sed -n 's/.*(\([A-Z0-9]*\))$/\1/p')
          test -n "$team"
          echo "IDENTITY=$identity" >> "$GITHUB_ENV"
          echo "TEAM_ID=$team" >> "$GITHUB_ENV"
          echo "signing as: $identity"

      # Briefcase notarizes with the keychain profile briefcase-macOS-<team id>
      # (docs/PACKAGING.md). In CI that profile is an App Store Connect API key.
      - name: Notary credentials
        if: env.SIGN == 'true'
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/AuthKey.p8"
          # The key as pasted from the .p8 file, or base64 of it.
          case "$APPLE_API_KEY_P8" in
            *"BEGIN PRIVATE KEY"*) printf '%s\n' "$APPLE_API_KEY_P8" > "$key" ;;
            *) printf '%s' "$APPLE_API_KEY_P8" | base64 --decode > "$key" ;;
          esac
          grep -q "BEGIN PRIVATE KEY" "$key" || { echo "APPLE_API_KEY_P8 isn't a .p8 key"; exit 1; }
          xcrun notarytool store-credentials "briefcase-macOS-$TEAM_ID" \
            --key "$key" --key-id "$APPLE_API_KEY" --issuer "$APPLE_API_ISSUER" >/dev/null
          rm -f "$key"
          echo "notary profile briefcase-macOS-$TEAM_ID stored"

      - name: Package, sign and notarize the .dmg
        if: env.SIGN == 'true'
        run: briefcase package macOS app -p dmg --identity "$IDENTITY" --no-input

      # What a stranger's Mac will decide: stapled ticket, accepted by Gatekeeper.
      - name: Gatekeeper accepts the .dmg
        if: env.SIGN == 'true'
        run: |
          set -euo pipefail
          dmg=$(ls dist/*.dmg | head -1)
          xcrun stapler validate "$dmg"
          spctl -a -vv -t open --context context:primary-signature "$dmg" 2>&1 | tee "$RUNNER_TEMP/spctl.txt"
          grep -q "accepted" "$RUNNER_TEMP/spctl.txt"
          grep -q "source=Notarized Developer ID" "$RUNNER_TEMP/spctl.txt"
          # And the app inside it, the way it lands in /Applications.
          mount=$(mktemp -d)
          hdiutil attach "$dmg" -nobrowse -readonly -mountpoint "$mount" >/dev/null
          codesign --verify --deep --strict "$mount/benchhud.app"
          spctl -a -vv -t exec "$mount/benchhud.app" 2>&1 | tee "$RUNNER_TEMP/spctl-app.txt"
          grep -q "source=Notarized Developer ID" "$RUNNER_TEMP/spctl-app.txt"
          for f in LICENSE NOTICES; do test -s "$mount/benchhud.app/Contents/Resources/app/$f"; done
          hdiutil detach "$mount" >/dev/null

      - name: Forget the certificate
        if: always() && env.SIGN == 'true'
        run: |
          security delete-keychain "$RUNNER_TEMP/build.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/AuthKey.p8"

      - name: The zip carries LICENSE and NOTICES
        if: env.SIGN != 'true'
        run: |
          zip=$(ls dist/*.zip | head -1)
          for f in LICENSE NOTICES; do
            unzip -l "$zip" | grep -q "benchhud.app/Contents/Resources/app/$f\$" \
              || { echo "$f missing from $zip"; exit 1; }
          done
          echo "both files in $zip"

      - uses: actions/upload-artifact@v4
        with:
          name: benchhud-macos
          path: |
            dist/*.zip
            dist/*.dmg
          if-no-files-found: error

  # Install it silently on a clean runner and check it starts, like deb-verify.
  msi-verify:
    needs: msi
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: benchhud-msi
          path: dist

      - name: msiexec install (silent)
        run: |
          $msi = (Get-ChildItem dist\*.msi | Select-Object -First 1).FullName
          $p = Start-Process msiexec.exe -Wait -PassThru `
            -ArgumentList '/i', "`"$msi`"", '/qn', '/l*v', 'msi.log'
          if ($p.ExitCode -ne 0) {
            Get-Content msi.log -Tail 80
            throw "msiexec exited with $($p.ExitCode)"
          }

      # Don't guess the install scope: look where a per-machine and a per-user
      # install would land, and use whichever holds benchhud.exe.
      - name: Find the install
        run: |
          $roots = @($env:ProgramFiles, ${env:ProgramFiles(x86)}, "$env:LOCALAPPDATA\Programs", $env:LOCALAPPDATA)
          $exe = Get-ChildItem -Path $roots -Recurse -Filter benchhud.exe -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -notmatch '\\Temp\\' } | Select-Object -First 1
          if (-not $exe) { throw "benchhud.exe not found under: $($roots -join ', ')" }
          Write-Host "installed at: $($exe.DirectoryName)"
          Get-ChildItem $exe.DirectoryName | Format-Table Name, Length
          "BENCHHUD_EXE=$($exe.FullName)" | Out-File -Append $env:GITHUB_ENV

      - name: It reports a version
        run: |
          # The GUI stub has no console, so its stdout may go nowhere. Print
          # what comes back; a missing line isn't a failure.
          $out = & $env:BENCHHUD_EXE --version 2>&1 | Out-String
          if ($out.Trim()) { Write-Host $out } else { Write-Host "no console output from the GUI stub; skipped" }

      - name: It starts (headless)
        run: |
          # Still running after the wait is the pass: Qt, OpenCV and the job DB
          # all loaded. An exit before then is a startup crash.
          $p = Start-Process $env:BENCHHUD_EXE -PassThru
          Start-Sleep -Seconds 45
          if ($p.HasExited) { throw "benchhud exited with $($p.ExitCode); expected to still be running" }
          Write-Host "still running after 45s (pid $($p.Id))"
          Stop-Process -Id $p.Id -Force

      # The installer's post-install step registers softcam.dll (#124). The
      # runner installs as an administrator, so it can; a per-user install by
      # someone who isn't leaves this to the Preferences button.
      - name: The installer registered the virtual camera
        run: |
          $dir = Split-Path $env:BENCHHUD_EXE
          $dll = Join-Path $dir 'app\softcam.dll'
          foreach ($f in $dll, (Join-Path $dir 'app\LICENSE'), (Join-Path $dir 'app\NOTICES')) {
            if (-not (Test-Path $f)) { throw "$f is not in the install" }
          }
          $key = 'Registry::HKEY_CLASSES_ROOT\CLSID\{AEF3B972-5FA5-4647-9571-358EB472BC9E}\InprocServer32'
          if (-not (Test-Path $key)) {
            Select-String -Path msi.log -Pattern 'benchhud:' | Select-Object -Last 10
            throw "softcam is not registered after the install"
          }
          $registered = (Get-Item $key).GetValue('')
          Write-Host "registered: $registered"
          if ($registered -ine $dll) { throw "registered $registered, expected $dll" }

      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
          sparse-checkout: packaging/windows
          path: repo

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # The whole path a streamer uses, short of OBS itself: the installed app
      # with output on, and a DirectShow reader getting its picture.
      - name: A camera app gets the installed app's picture
        run: |
          python -m pip install --quiet opencv-python-headless numpy
          $cfg = Join-Path $env:RUNNER_TEMP 'benchhud.toml'
          Set-Content -Path $cfg -Value "[output]`nenabled = true`nwidth = 1280`nheight = 720`n`n[panels.scope]`nenabled = true`ndevice = `"`"`n"
          $env:BENCHHUD_CONFIG = $cfg
          $p = Start-Process $env:BENCHHUD_EXE -PassThru
          try {
            python repo\packaging\windows\read_virtual_camera.py 1280 720 90
            $code = $LASTEXITCODE
            if ($p.HasExited) { throw "benchhud exited with $($p.ExitCode) while publishing" }
          } finally {
            if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
          }
          if ($code -ne 0) { throw "no picture from the installed app's virtual camera" }

      - name: Uninstalling takes the registration with it
        run: |
          $msi = (Get-ChildItem dist\*.msi | Select-Object -First 1).FullName
          $p = Start-Process msiexec.exe -Wait -PassThru `
            -ArgumentList '/x', "`"$msi`"", '/qn', '/l*v', 'msi-uninstall.log'
          if ($p.ExitCode -ne 0) {
            Get-Content msi-uninstall.log -Tail 80
            throw "msiexec /x exited with $($p.ExitCode)"
          }
          $key = 'Registry::HKEY_CLASSES_ROOT\CLSID\{AEF3B972-5FA5-4647-9571-358EB472BC9E}\InprocServer32'
          if (Test-Path $key) { throw "softcam is still registered after the uninstall" }
          Write-Host "registration removed"
