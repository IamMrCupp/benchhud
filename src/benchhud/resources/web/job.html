<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>benchhud · job card</title>
<link rel="stylesheet" href="/static/panel.css">
<script src="/static/panel.js"></script>
</head>
<body>
<!-- Only whitelisted, PII-free job fields ever reach this page (see payloads.py). -->
<div class="job live hidden" id="card">
  <div class="title" id="title"></div>
  <div class="detail" id="detail"></div>
  <div class="status" id="status"></div>
</div>
<script>
"use strict";
const card = document.getElementById("card");

subscribe("job", (data) => {
  const job = data ? data.job : null;
  // No job selected (or benchhud down): show nothing rather than a stale card.
  card.classList.toggle("hidden", !job);
  if (!job) return;
  document.getElementById("title").textContent = job.device || `Job #${job.id}`;
  const detail = [job.board_id, job.external_ref].filter(Boolean).join(" · ");
  document.getElementById("detail").textContent = detail;
  document.getElementById("status").textContent = String(job.status).replace(/_/g, " ");
});
</script>
</body>
</html>
