[project]
name = "benchhud"
dynamic = ["version"]
description = "A microsoldering / board-repair bench HUD: fuses scope + thermal video with instrument telemetry and outputs a virtual camera for OBS."
readme = "README.md"
requires-python = ">=3.12"
license = "PolyForm-Small-Business-1.0.0"
license-files = ["LICENSE"]
authors = [{ name = "Aaron Cupp", email = "mrcupp@mrcupp.com" }]
keywords = ["microsoldering", "board-repair", "thermal", "hud", "obs", "opencv"]

dependencies = [
    "numpy>=2.1",
    "opencv-python>=4.10",
    "pyserial>=3.5",
    "PySide6>=6.8",
    "tomlkit>=0.13",
]

[project.urls]
Homepage = "https://github.com/IamMrCupp/benchhud"
Issues = "https://github.com/IamMrCupp/benchhud/issues"

[project.scripts]
benchhud = "benchhud.app:main"

[dependency-groups]
dev = [
    "ruff>=0.8",
    "pytest>=8.3",
    "pytest-qt>=4.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/benchhud/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/benchhud"]

# Native app bundles (Phase 7 §B). Name, version, description, licence and
# dependencies all come from [project] above — Briefcase reads PEP 621 — so
# this section only holds what a bundle needs on top of a wheel.
[tool.briefcase]
project_name = "benchhud"
bundle = "com.iammrcupp"

[tool.briefcase.app.benchhud]
formal_name = "benchhud"
# Installers truncate past ~80 chars; [project]'s full sentence stays for PyPI.
description = "Microsoldering bench HUD: scope + thermal + telemetry, out to OBS."
# Debian packages require one; shown by apt show and software centres.
long_description = """benchhud is the command centre for a board-repair bench. It fuses a
microscope feed with a thermal camera, so a hot component's bloom lands on that
component. It shows live power-supply and DMM readings, keeps a repair log, and
sends the composite to OBS as a virtual camera for streaming."""
sources = ["src/benchhud"]
icon = "packaging/icons/benchhud"
# The reason macOS shows in its camera prompt. Without it a bundle can't ask
# at all, and camera access from a bare `uv run` lands on the terminal app.
permission.camera = "benchhud reads your scope and thermal cameras to build the bench HUD."

[tool.briefcase.app.benchhud.macOS]
# opencv-python ships per-arch wheels only, so a universal2 bundle can't build.
universal_build = false
# PySide6 6.8+ and opencv-python 5 only publish macosx_13_0 wheels; Briefcase's
# default floor of 11.0 would make pip find nothing (or an ancient OpenCV).
min_os_version = "13.0"
requires = ["std-nslog~=1.0.3"]
# The terminal panel (#194) draws in QtWebEngine, and Chromium's V8 needs JIT
# pages under the hardened runtime. Without this its renderer can't reserve
# its code range ("V8 process OOM") and the page stays blank. Briefcase signs
# every binary, the QtWebEngineProcess helper included, with these entitlements.
entitlement."com.apple.security.cs.allow-jit" = true

[tool.briefcase.app.benchhud.linux.system.debian]
# Native .deb for the bench (Ubuntu). benchhud needs raw /dev/video*, /dev/ttyUSB*
# and a v4l2loopback node, which a sandboxed Flatpak fights. A system package
# just uses the user's video/dialout groups. The Python wheels (PySide6, OpenCV)
# bundle their own Qt and codecs; these are the system libraries Qt's xcb and
# wayland platform plugins load at runtime. CI installs the core of this list.
system_runtime_requires = [
    "libegl1",
    "libgl1",
    "libglib2.0-0t64",
    "libfontconfig1",
    "libdbus-1-3",
    "libxkbcommon0",
    "libxkbcommon-x11-0",
    "libxcb-cursor0",
    "libxcb-icccm4",
    "libxcb-image0",
    "libxcb-keysyms1",
    "libxcb-randr0",
    "libxcb-render-util0",
    "libxcb-shape0",
    "libxcb-xinerama0",
    "libxcb-xkb1",
    "libwayland-client0",
    "libwayland-cursor0",
    "libwayland-egl1",
    # QtWebEngine (Chromium), for the terminal panel (#194). Loaded only when the
    # terminal is on, so CI checks them with ldd rather than by starting it.
    "libnss3",
    "libnspr4",
    "libxcomposite1",
    "libxdamage1",
    "libxrandr2",
    "libxtst6",
    "libxkbfile1",
    "libxshmfence1",
    "libgbm1",
    "libdrm2",
    "libasound2t64",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
qt_api = "pyside6"
